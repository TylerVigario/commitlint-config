# Dependency updates, for the two things that change under this repository: the
# npm packages its tests run against, and the actions its workflows pin.
#
# Every npm dependency here is a devDependency -- the package has no runtime
# dependencies, and the parser preset is a peer the consumer chooses. A bump
# changes what the tests run against and nothing a consumer installs, so it is a
# `chore`, which releases nothing. Actions are `ci`, for the same reason.
#
# Grouped for minor and patch only. A major is where the breakage lives, and in a
# group a bump that is fine is held back by one that is not -- so a major arrives
# on its own and can be refused on its own.
#
# A new version waits a week before it is proposed, and a major two: most
# compromised releases are found and pulled within days, and a major is the
# bump most likely to need reading. .npmrc holds installs to the same week.
# Security updates are not held; Dependabot's cooldown leaves them alone.
# GitHub Actions refuses the per-bump keys, and one refused key fails this whole
# file, leaving Dependabot on the last version it accepted -- so its entry
# carries the week alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
      prefix-development: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
